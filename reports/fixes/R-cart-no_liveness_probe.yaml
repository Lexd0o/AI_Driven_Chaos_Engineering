# Fix for R-cart-no_liveness_probe (medium, status=predicted)
# Evidence: has_liveness=False - a hung (not crashed) process won't be auto-restarted
# Apply:    kubectl -n otel-demo patch deployment cart --patch-file reports/fixes/R-cart-no_liveness_probe.yaml
# Not applied automatically (Decisions.md D-007).
spec:
  template:
    spec:
      containers:
      - name: cart
        livenessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
