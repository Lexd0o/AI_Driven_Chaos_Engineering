# Fix for R-valkey-cart-no_readiness_probe (medium, status=predicted)
# Evidence: has_readiness=False - a restarted pod may receive traffic before it's ready
# Apply:    kubectl -n otel-demo patch deployment valkey-cart --patch-file reports/fixes/R-valkey-cart-no_readiness_probe.yaml
# Not applied automatically (Decisions.md D-007).
spec:
  template:
    spec:
      containers:
      - name: valkey-cart
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
