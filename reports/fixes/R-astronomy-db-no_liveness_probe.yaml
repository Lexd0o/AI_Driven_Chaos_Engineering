# Fix for R-astronomy-db-no_liveness_probe (medium, status=predicted)
# Evidence: has_liveness=False - a hung (not crashed) process won't be auto-restarted
# Apply:    kubectl -n otel-demo patch deployment astronomy-db --patch-file reports/fixes/R-astronomy-db-no_liveness_probe.yaml
# Not applied automatically (Decisions.md D-007).
spec:
  template:
    spec:
      containers:
      - name: astronomy-db
        livenessProbe:
          exec:
            command:
            - pg_isready
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
