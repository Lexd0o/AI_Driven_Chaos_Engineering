# Fix for R-email-no_liveness_probe (medium, status=predicted)
# Evidence: has_liveness=False - a hung (not crashed) process won't be auto-restarted
# Apply:    kubectl -n otel-demo patch deployment email --patch-file reports/fixes/R-email-no_liveness_probe.yaml
# Not applied automatically (Decisions.md D-007).
spec:
  template:
    spec:
      containers:
      - name: email
        livenessProbe:
          tcpSocket:
            port: service
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
