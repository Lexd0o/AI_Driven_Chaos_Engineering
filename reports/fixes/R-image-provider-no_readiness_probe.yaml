# Fix for R-image-provider-no_readiness_probe (low, status=predicted)
# Evidence: has_readiness=False - a restarted pod may receive traffic before it's ready
# Apply:    kubectl -n otel-demo patch deployment image-provider --patch-file reports/fixes/R-image-provider-no_readiness_probe.yaml
# Not applied automatically (Decisions.md D-007).
spec:
  template:
    spec:
      containers:
      - name: image-provider
        readinessProbe:
          httpGet:
            path: /status
            port: service
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
