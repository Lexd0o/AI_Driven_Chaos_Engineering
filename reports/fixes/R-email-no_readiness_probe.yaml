# Fix for R-email-no_readiness_probe (medium, status=predicted)
# Evidence: has_readiness=False - a restarted pod may receive traffic before it's ready
# Apply:    kubectl -n otel-demo patch deployment email --patch-file reports/fixes/R-email-no_readiness_probe.yaml
# Not applied automatically (Decisions.md D-007).
spec:
  template:
    spec:
      containers:
      - name: email
        readinessProbe:
          tcpSocket:
            port: service
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
