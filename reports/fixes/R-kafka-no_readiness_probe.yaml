# Fix for R-kafka-no_readiness_probe (low, status=predicted)
# Evidence: has_readiness=False - a restarted pod may receive traffic before it's ready
# Apply:    kubectl -n otel-demo patch deployment kafka --patch-file reports/fixes/R-kafka-no_readiness_probe.yaml
# Not applied automatically (Decisions.md D-007).
spec:
  template:
    spec:
      containers:
      - name: kafka
        readinessProbe:
          tcpSocket:
            port: plaintext
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
