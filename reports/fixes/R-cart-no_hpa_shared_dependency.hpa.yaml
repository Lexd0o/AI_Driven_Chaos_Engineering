# Fix for R-cart-no_hpa_shared_dependency (medium, status=predicted)
# Evidence: has_hpa=False, 2 callers - can't absorb a traffic or latency spike
# Apply:    kubectl apply -f reports/fixes/R-cart-no_hpa_shared_dependency.hpa.yaml
# Not applied automatically (Decisions.md D-007).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart-hpa
  namespace: otel-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
