# Fix for R-image-provider-no_liveness_probe (low, status=predicted)
# Evidence: has_liveness=False - a hung (not crashed) process won't be auto-restarted
# Apply:    kubectl -n otel-demo patch deployment image-provider --patch-file reports/fixes/R-image-provider-no_liveness_probe.yaml
# Not applied automatically (Decisions.md D-007).
spec:
  template:
    spec:
      containers:
      - name: image-provider
        livenessProbe:
          httpGet:
            path: /status
            port: service
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
