# LLM planner settings (plan.py). O-2 (provider/model/key) is still open for the team -
# Claude is the provisional choice; change the model here, not in code (Rules.md rule 16).
# Credentials come from the environment (ANTHROPIC_API_KEY, or an `ant auth login` profile).
# No credentials, an API error, a refusal, or invalid output -> the deterministic text is kept.

model: claude-opus-5-5
effort: medium          # writing hypotheses for 6-8 experiments; raise only if quality is lacking
max_tokens: 16000

# The only journeys an LLM may name in expected_impact (Decisions.md D-008 weights).
journeys: [browse, cart, checkout, ads-recs]

# Where each journey's requests leave the frontend (from the demo's frontend code paths).
# plan.py adds everything these call and everything upstream of them (frontend, frontend-proxy)
# to get the deterministic expected_impact.journeys. Replace with P2's journey map (T1.3).
journey_roots:
  browse: [product-catalog, currency, image-provider]   # home + product pages, prices, images
  cart: [cart, shipping]                                 # add to cart, cart page shipping quote
  checkout: [checkout]                                   # place order (checkout calls the rest)
  ads-recs: [ad, recommendation]                         # ads + "you may also like"

# Bounds on LLM-written text; anything outside is dropped and the template text kept.
min_text_chars: 20
max_text_chars: 400
