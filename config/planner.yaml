# LLM planner settings (plan.py). O-2 resolved in practice: the team has a Groq key, so the
# planner uses Groq (same provider as the report, D-018). Switch back with provider: anthropic
# + model: claude-opus-5-5 (needs ANTHROPIC_API_KEY). Change it here, not in code (Rules.md rule 16).
# Groq key: GROQ_API_KEY env or the gitignored repo-root .env.
# No credentials, an API error, a refusal, or invalid output -> the deterministic text is kept.

provider: groq          # anthropic | groq
model: openai/gpt-oss-20b
effort: medium          # anthropic only
max_tokens: 16000

# The only journeys an LLM may name in expected_impact (Decisions.md D-008 weights).
journeys: [browse, cart, checkout, ads-recs]

# Where each journey's requests leave the frontend (from the demo's frontend code paths).
# plan.py adds everything these call and everything upstream of them (frontend, frontend-proxy)
# to get the deterministic expected_impact.journeys. Replace with P2's journey map (T1.3).
journey_roots:
  browse: [product-catalog, currency, image-provider]   # home + product pages, prices, images
  cart: [cart, shipping]                                 # add to cart, cart page shipping quote
  checkout: [checkout]                                   # place order (checkout calls the rest)
  ads-recs: [ad, recommendation]                         # ads + "you may also like"

# Bounds on LLM-written text; anything outside is dropped and the template text kept.
min_text_chars: 20
max_text_chars: 400

# Journey baseline (src/baseline.py) and the SLOs plan.py derives from data/baseline.json.
baseline:
  minutes: 5
  interval_s: 5
  timeout_s: 5
  checkout_every_n: 3     # checkout places a real order per sample, so sample it every Nth interval
  p95_factor: 2.0        # slo.p95_ms_max = max(p95_floor_ms, max baseline p95 x p95_factor)
  p95_floor_ms: 1000
  success_margin: 0.02   # slo.success_rate_min = min(0.95, max(success_floor, min baseline rate - margin))
  success_floor: 0.80
